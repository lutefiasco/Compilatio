<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compilatio - Manuscript Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /*
         * Compilatio Manuscript Viewer
         * ============================
         * OpenSeadragon-based IIIF viewer.
         * Three-panel layout: Metadata sidebar | Thumbnail grid | OSD image
         * Thumbnail panel resizable to 1 or 2 columns.
         *
         * This page is self-contained: it deliberately does NOT load
         * css/styles.css. The token block below mirrors the one there, so the
         * two must be kept in step by hand. Surfaces used here: #1a1a1a page,
         * #1e1e1e chrome, #232323 selector bar, #2a2a2a inputs, #141414 image well.
         */

        :root {
            /* Worst-case ratios across every surface on this page, measured on
               composited pixels. Kept in step with css/styles.css by hand --
               this page links no stylesheet, so nothing enforces that. Softened
               2026-08-06; warm greys rather than neutral. */
            --text: #c4c0b8;            /*  7.16:1 - body copy                */
            --text-heading: #ddd9d1;    /*  9.46:1 - headings, shelfmarks     */
            --text-secondary: #aeaaa2;  /*  5.44:1 - supporting prose         */
            --text-muted: #9b978f;      /*  4.72:1 - FLOOR for body-size text.
                                           Dimmer than this fails 1.4.3.      */
            --accent: #d6d1c7;          /*  8.44:1 - links, ivory accent      */
            --border-ui: #757575;       /*  3.12:1 - control borders (1.4.11) */
            --border-subtle: #2a2a2a;   /* decorative rules only              */
            --focus: #e8e4dc;           /* 11.3:1+ everywhere (2.4.7)         */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Focus visibility (WCAG 2.4.7). One ring for everything focusable.
           Never add `outline: none` without an equally visible replacement. */
        :focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 2px;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #1a1a1a;
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* === SITE HEADER === */
        .site-header {
            display: flex;
            align-items: baseline;
            gap: 1.5rem;
            padding: 0.4rem 1rem;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
            flex-shrink: 0;
        }
        .site-header h1 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.3rem;
            color: var(--text-heading);
            font-weight: 300;
            letter-spacing: 0.1em;
        }
        .site-header h1 a {
            color: inherit;
            text-decoration: none;
        }
        .site-header .back-link {
            margin-left: auto;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-decoration: none;
        }
        .site-header .back-link:hover { color: var(--accent); }

        /* === SELECTOR BAR === */
        .selector-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1rem;
            background: #232323;
            border-bottom: 1px solid #2a2a2a;
            flex-shrink: 0;
        }
        .selector-bar select {
            padding: 0.3rem 0.5rem;
            font-family: inherit;
            font-size: 0.8rem;
            color: var(--text);
            background: #1a1a1a;
            border: 1px solid var(--border-ui);
            border-radius: 2px;
        }
        .selector-bar select:focus {
            border-color: var(--focus);
        }
        .selector-bar .count {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* === VIEWER HEADER (navigation toolbar) === */
        .viewer-header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 0.5rem;
            height: 36px;
            background: #1e1e1e;
            border-bottom: 1px solid #2a2a2a;
            flex-shrink: 0;
            position: relative;
        }
        .nav-controls {
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .nav-controls button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 4px 6px;
            cursor: pointer;
            border-radius: 2px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-controls button svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
        .nav-controls button:hover {
            color: var(--accent);
            background: #333;
        }
        .nav-controls button:disabled {
            color: #444;
            cursor: default;
            background: transparent;
        }
        .nav-controls .folio-input {
            width: 110px;
            padding: 3px 8px;
            font-family: inherit;
            font-size: 0.8rem;
            color: var(--text);
            background: #2a2a2a;
            border: 1px solid var(--border-ui);
            border-radius: 2px;
            text-align: center;
        }
        .nav-controls .folio-input:focus {
            border-color: var(--focus);
        }
        .nav-controls .image-counter {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-left: 10px;
            white-space: nowrap;
        }
        .mode-controls {
            position: absolute;
            right: 0.5rem;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .mode-controls button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 4px 6px;
            cursor: pointer;
            border-radius: 2px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mode-controls button svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
        }
        .mode-controls button:hover {
            color: var(--accent);
            background: #333;
        }
        .mode-controls button.active {
            color: var(--accent);
            background: #333;
        }

        /* === MAIN LANDMARK ===
           <main> was introduced purely as a landmark (WCAG 1.3.1 / 2.4.1). It
           takes over the flex column that <body> previously applied to the
           toolbar and viewer body directly, so the geometry is unchanged. */
        .viewer-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* === VIEWER BODY (three panels) === */
        .viewer-body {
            flex: 1;
            display: flex;
            min-height: 0;
            overflow: hidden;
        }

        /* Compilatio metadata sidebar */
        .meta-sidebar {
            width: 200px;
            min-width: 200px;
            background: #1e1e1e;
            border-right: 1px solid #2a2a2a;
            overflow-y: auto;
            padding: 0.75rem;
            flex-shrink: 0;
        }
        /* The shelfmark is the page's subject heading: <h2>, directly under the
           site <h1>. It was an <h3>, which skipped a level (WCAG 1.3.1). */
        .meta-sidebar h2 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 1.05rem;
            color: var(--text-heading);
            font-weight: 400;
            margin-bottom: 0.3rem;
            line-height: 1.3;
        }
        .meta-sidebar .meta-repo {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-bottom: 0.15rem;
        }
        .meta-sidebar .meta-date {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
        }
        .meta-sidebar details {
            margin-bottom: 0.4rem;
        }
        .meta-sidebar summary {
            font-size: 0.75rem;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.2rem 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .meta-sidebar summary:hover {
            color: var(--accent);
        }
        .meta-sidebar .meta-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.5;
            padding: 0.3rem 0;
        }
        .meta-sidebar .meta-list {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.5;
            padding: 0.2rem 0;
        }
        .meta-sidebar .meta-list dt {
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 0.2rem;
        }
        .meta-sidebar .meta-list dd {
            margin-left: 0;
            margin-bottom: 0.15rem;
        }
        .meta-sidebar .source-link {
            display: inline-block;
            margin-top: 0.5rem;
            padding: 0.3rem 0.6rem;
            background: var(--accent);
            color: #1a1a1a;
            text-decoration: none;
            border-radius: 2px;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .meta-sidebar .source-link:hover {
            background: #fff;
        }
        .meta-sidebar .meta-placeholder {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Thumbnail panel */
        .thumb-panel {
            width: 220px;
            min-width: 90px;
            max-width: 400px;
            background: #1a1a1a;
            border-right: 1px solid #2a2a2a;
            overflow-y: auto;
            overflow-x: hidden;
            flex-shrink: 0;
        }
        .thumb-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 4px;
            padding: 4px;
        }
        /* .thumb-item is a <button> (it must be keyboard-operable). These
           declarations undo the UA button styling so it still paints exactly
           like the <div> it replaced -- do not remove them. */
        .thumb-item {
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 2px;
            overflow: hidden;
            background: #232323;
            transition: border-color 0.15s;
            display: block;
            width: 100%;
            padding: 0;
            margin: 0;
            font: inherit;
            color: inherit;
            text-align: center;
            appearance: none;
            -webkit-appearance: none;
        }
        .thumb-item:hover {
            border-color: var(--border-ui);
        }
        .thumb-item.active {
            border-color: var(--accent);
        }
        .thumb-item img {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            display: block;
            background: #2a2a2a;
        }
        .thumb-item .thumb-label {
            display: block;
            font-size: 0.65rem;
            color: var(--text-muted);
            text-align: center;
            padding: 2px 2px 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .thumb-item.active .thumb-label {
            color: var(--accent);
        }

        /* Resizable divider between thumbnails and image */
        .divider {
            width: 6px;
            background: #2a2a2a;
            cursor: col-resize;
            flex-shrink: 0;
            position: relative;
            transition: background 0.15s;
        }
        .divider:hover,
        .divider.dragging {
            background: var(--accent);
        }
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2px;
            height: 30px;
            background: var(--border-ui);
            border-radius: 1px;
        }
        .divider:hover::after,
        .divider.dragging::after {
            background: #1a1a1a;
        }

        /* Image panel (OpenSeadragon) */
        .image-panel {
            flex: 1;
            min-width: 200px;
            position: relative;
            background: #141414;
        }
        #osd-viewer {
            width: 100%;
            height: 100%;
        }
        .viewer-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .viewer-placeholder.hidden {
            display: none;
        }

        /* === CUSTOM OSD OVERLAY CONTROLS (vertical stack, top-left of image) === */
        .osd-controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 1px;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 3px;
            padding: 2px;
        }
        .osd-controls button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: transparent;
            border: none;
            color: #ccc;
            cursor: pointer;
            border-radius: 2px;
            padding: 0;
        }
        .osd-controls button:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
        }
        .osd-controls button svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Loading indicator */
        .loading-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(20, 20, 20, 0.8);
            color: var(--text-muted);
            font-size: 0.85rem;
            z-index: 10;
            pointer-events: none;
        }
        .loading-overlay.hidden {
            display: none;
        }

        /* === Scrollbar styling === */
        .thumb-panel::-webkit-scrollbar,
        .meta-sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .thumb-panel::-webkit-scrollbar-track,
        .meta-sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
        .thumb-panel::-webkit-scrollbar-thumb,
        .meta-sidebar::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }
        .thumb-panel::-webkit-scrollbar-thumb:hover,
        .meta-sidebar::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Available to screen readers, invisible on screen. Used for the
           status live region, which must be announced but must not disturb
           a layout built around a fixed-height viewport. */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Skip link (2.4.1). Off-screen until focused -- display:none would
           make it unfocusable and therefore useless. Matters here because the
           thumbnail strip can hold hundreds of items between the toolbar and
           the image. */
        .skip-link {
            position: absolute;
            left: -9999px;
            top: 0;
            z-index: 200;
            padding: 0.5rem 0.9rem;
            background: var(--accent);
            color: #1a1a1a;
            font-size: 0.85rem;
            text-decoration: none;
        }
        .skip-link:focus {
            left: 0;
        }

        /* Reduced motion (2.3.3). Near-zero rather than none, so anything
           listening for transitionend/animationend still fires. */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* User select prevention during drag */
        body.dragging {
            user-select: none;
            -webkit-user-select: none;
            cursor: col-resize !important;
        }
        body.dragging * {
            cursor: col-resize !important;
        }

        /* === NARROW / HIGH-ZOOM LAYOUT ===
           WCAG 1.4.10 Reflow and 1.4.4 Resize text. The three-panel row has a
           hard floor of ~626px (200 sidebar + 6 divider + 220 thumbnails + 200
           image); below that a body locked to 100vh with overflow:hidden
           clipped content with no way to scroll to it. Here the row becomes a
           column, the thumbnail rail wraps into a grid, and the page scrolls.

           640px is reached at 400% zoom on any window >= 1600px, and at 200%
           on a 1280px window. Nothing in this block applies above it, so the
           desktop layout is untouched. Panels are NOT reordered: the image is
           the natural focus, but moving it visually ahead of the DOM would put
           focus order out of step with reading order (2.4.3). The sidebar is
           capped instead, so the image sits just below the fold. */
        @media (max-width: 640px) {
            /* The fixed-height body is what made the overflow unreachable. */
            body {
                height: auto;
                min-height: 100vh;
                overflow: visible;
            }

            /* Chrome rows wrap rather than running off-screen. */
            .site-header,
            .selector-bar,
            .viewer-header,
            .nav-controls {
                flex-wrap: wrap;
            }
            .viewer-header {
                height: auto;
                min-height: 36px;
                padding: 4px 0.5rem;
                gap: 4px;
            }
            /* A <select> is as wide as its longest option unless constrained,
               and the manuscript list is far wider than 320px. */
            .selector-bar select {
                flex: 1 1 100%;
                width: 100%;
                min-width: 0;
                max-width: 100%;
            }
            /* Absolute positioning would sit on top of the wrapped nav row. */
            .mode-controls {
                position: static;
                margin-left: auto;
            }

            /* Explicit flex:none throughout. A flex:1 child (flex-basis 0) in a
               column whose height is now auto has no definite space to fill;
               every panel below carries its own height instead. */
            .viewer-main {
                flex: none;
            }
            .viewer-body {
                flex: none;
                flex-direction: column;
                overflow: visible;
            }

            .meta-sidebar {
                width: 100%;
                min-width: 0;
                max-height: 30vh;
                border-right: none;
                border-bottom: 1px solid #2a2a2a;
            }

            /* The thumbnail rail becomes a full-width block and its existing
               auto-fill grid wraps into rows on its own -- roughly four
               columns at 320px. A horizontal filmstrip was the other option
               and was rejected: it would have scrolled sideways inside a page
               that scrolls down, which is the two-dimensional scrolling 1.4.10
               exists to prevent. Capped height rather than full height because
               213 pages unwrapped would be some 5,000px of page above the
               image.

               !important because setThumbWidth() writes an inline width for
               the divider drag; without it, anyone who had ever resized the
               panel would keep that pixel width here. */
            .thumb-panel {
                width: 100% !important;
                min-width: 0;
                max-width: none;
                height: 34vh;
                min-height: 180px;
                border-right: none;
                border-bottom: 1px solid #2a2a2a;
            }

            /* The divider resizes along an axis this layout does not have. */
            .divider {
                display: none;
            }

            /* #osd-viewer is height:100%, so its parent needs a definite
               height once the flex chain no longer supplies one. */
            .image-panel {
                flex: none;
                min-width: 0;
                height: 65vh;
                min-height: 320px;
            }
        }
    </style>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to viewer</a>

    <!-- Site header -->
    <header class="site-header">
        <h1><a href="index.html">Compilatio</a></h1>
        <a href="browse.html" class="back-link">&larr; Browse</a>
    </header>

    <!-- Manuscript selector -->
    <nav class="selector-bar" aria-label="Manuscript selection">
        <select id="repo-select" aria-label="Repository">
            <option value="">-- Select repository --</option>
        </select>
        <select id="collection-select" aria-label="Collection" disabled>
            <option value="">-- Select collection --</option>
        </select>
        <select id="ms-select" aria-label="Manuscript" disabled>
            <option value="">-- Select manuscript --</option>
        </select>
        <span class="count" id="ms-count"></span>
    </nav>

    <!-- Everything below is the page's primary content. <main> carries the flex
         column that <body> used to hold directly, so the landmark is free of
         layout consequences. -->
    <main class="viewer-main" id="main-content" tabindex="-1">

    <!-- Viewer header toolbar. role="group" rather than role="toolbar": toolbar
         promises roving arrow-key focus, which this control set does not yet
         implement, and a promise the widget cannot keep is worse than none. -->
    <div class="viewer-header" id="viewer-header" role="group" aria-label="Page navigation">
        <div class="nav-controls">
            <button id="btn-first" type="button" aria-label="First page" title="First page" disabled>
                <svg viewBox="0 0 14 14" aria-hidden="true" focusable="false"><line x1="3" y1="3" x2="3" y2="11"/><polyline points="11,3 6,7 11,11"/></svg>
            </button>
            <button id="btn-prev" type="button" aria-label="Previous page" title="Previous page" disabled>
                <svg viewBox="0 0 14 14" aria-hidden="true" focusable="false"><polyline points="10,3 5,7 10,11"/></svg>
            </button>
            <input type="text" class="folio-input" id="folio-input" placeholder="folio" aria-label="Go to folio" title="Type a folio label and press Enter" disabled>
            <button id="btn-next" type="button" aria-label="Next page" title="Next page" disabled>
                <svg viewBox="0 0 14 14" aria-hidden="true" focusable="false"><polyline points="4,3 9,7 4,11"/></svg>
            </button>
            <button id="btn-last" type="button" aria-label="Last page" title="Last page" disabled>
                <svg viewBox="0 0 14 14" aria-hidden="true" focusable="false"><polyline points="3,3 8,7 3,11"/><line x1="11" y1="3" x2="11" y2="11"/></svg>
            </button>
            <span class="image-counter" id="image-counter"></span>
        </div>
        <div class="mode-controls">
            <button id="btn-single" type="button" aria-label="Single page view" aria-pressed="true" title="Single page view" class="active">
                <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><rect x="3" y="2" width="10" height="12" rx="1"/></svg>
            </button>
            <button id="btn-fullscreen" type="button" aria-label="Full screen" aria-pressed="false" title="Full screen">
                <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><polyline points="2,6 2,2 6,2"/><polyline points="10,2 14,2 14,6"/><polyline points="14,10 14,14 10,14"/><polyline points="6,14 2,14 2,10"/></svg>
            </button>
        </div>
    </div>

    <!-- Position changes are otherwise silent: the counter and folio field
         update visually with nothing announced. role="status" + polite means a
         screen-reader user hears the new folio without losing their place. -->
    <p id="viewer-status" class="visually-hidden" role="status" aria-live="polite"></p>

    <!-- Viewer body: three panels -->
    <div class="viewer-body" id="viewer-body">
        <!-- Compilatio metadata sidebar -->
        <aside class="meta-sidebar" id="meta-sidebar" aria-label="Manuscript details">
            <div id="meta-content">
                <p class="meta-placeholder">Select a manuscript to view details.</p>
            </div>
        </aside>

        <!-- Thumbnail panel -->
        <nav class="thumb-panel" id="thumb-panel" aria-label="Pages">
            <div class="thumb-grid" id="thumb-grid"></div>
        </nav>

        <!-- Resizable divider. Now a real separator widget: focusable, with
             arrow-key resizing, so the thumbnail panel is adjustable without a
             pointer. aria-valuenow is the panel width in px, kept in sync by
             initDivider(). -->
        <div class="divider" id="divider" role="separator" tabindex="0"
             aria-orientation="vertical" aria-label="Resize thumbnail panel"
             aria-valuemin="90" aria-valuemax="400" aria-valuenow="220"></div>

        <!-- Image panel -->
        <section class="image-panel" id="image-panel" aria-label="Manuscript image">
            <div id="osd-viewer"></div>
            <!-- Custom OSD controls: vertical stack, top-left -->
            <div class="osd-controls" id="osd-controls">
                <button id="osd-zoom-in" type="button" aria-label="Zoom in" title="Zoom in">
                    <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><line x1="8" y1="4" x2="8" y2="12"/><line x1="4" y1="8" x2="12" y2="8"/></svg>
                </button>
                <button id="osd-zoom-out" type="button" aria-label="Zoom out" title="Zoom out">
                    <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><line x1="4" y1="8" x2="12" y2="8"/></svg>
                </button>
                <button id="osd-home" type="button" aria-label="Fit to page" title="Fit to page">
                    <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><rect x="3" y="3" width="10" height="10" rx="1"/></svg>
                </button>
                <button id="osd-rotate" type="button" aria-label="Rotate right" title="Rotate right">
                    <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M12,7 A4.5,4.5 0 1,1 8,3"/><polyline points="8,1 8,3.5 10.5,3.5"/></svg>
                </button>
            </div>
            <div class="viewer-placeholder" id="viewer-placeholder">Select a manuscript above to view it.</div>
            <div class="loading-overlay hidden" id="loading-overlay">Loading manifest...</div>
        </section>
    </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/openseadragon@6.0.2/build/openseadragon/openseadragon.min.js"
            integrity="sha384-7CySh3EMRRN5r2E82ru4URZMpjhLMwArPSxxAwdtldDSsY3XQJIWwlMFR7L7ZGjl"
            crossorigin="anonymous"></script>
    <script>
    (function() {
        'use strict';

        // =============================================
        // CONFIGURATION
        // =============================================

        const API_BASE = '/api';
        const OSD_PREFIX = 'https://cdn.jsdelivr.net/npm/openseadragon@6.0.2/build/openseadragon/images/';

        // =============================================
        // STATE
        // =============================================

        let repositories = [];      // All repositories from API
        let currentRepoId = null;   // Currently selected repository
        let currentCollection = null; // Currently selected collection
        let osdViewer = null;
        let canvases = [];          // Parsed canvas list from current manifest
        let currentIndex = 0;       // Current canvas index
        let currentManuscript = null;

        // =============================================
        // DOM REFERENCES
        // =============================================

        const repoSelect = document.getElementById('repo-select');
        const collectionSelect = document.getElementById('collection-select');
        const msSelect = document.getElementById('ms-select');
        const msCount = document.getElementById('ms-count');
        const metaContent = document.getElementById('meta-content');
        const thumbGrid = document.getElementById('thumb-grid');
        const thumbPanel = document.getElementById('thumb-panel');
        const divider = document.getElementById('divider');
        const placeholder = document.getElementById('viewer-placeholder');
        const loadingOverlay = document.getElementById('loading-overlay');
        const folioInput = document.getElementById('folio-input');
        const imageCounter = document.getElementById('image-counter');
        const viewerStatus = document.getElementById('viewer-status');
        const btnFirst = document.getElementById('btn-first');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnLast = document.getElementById('btn-last');
        const btnFullscreen = document.getElementById('btn-fullscreen');

        // =============================================
        // INITIALIZATION
        // =============================================

        document.addEventListener('DOMContentLoaded', async () => {
            initOSD();
            initDivider();
            initNavigation();
            initKeyboard();
            initThumbnailKeyboard();

            // Load repositories from API
            try {
                const resp = await fetch(`${API_BASE}/repositories`);
                repositories = await resp.json();
                populateRepos();
                repoSelect.addEventListener('change', handleRepoChange);
                collectionSelect.addEventListener('change', handleCollectionChange);
                msSelect.addEventListener('change', handleMsSelection);
            } catch (e) {
                console.error('Failed to load repositories:', e);
            }

            // Deep link support
            const params = new URLSearchParams(window.location.search);
            const msId = params.get('ms');
            const manifestUrl = params.get('manifest');
            if (msId) {
                // Try to load from API directly
                try {
                    const resp = await fetch(`${API_BASE}/manuscripts/${msId}`);
                    const ms = await resp.json();
                    if (ms && !ms.error) {
                        ms.repository = ms.repository_short || ms.repository_name || ms.repository;
                        // Set selectors to match the manuscript
                        if (ms.repository_id) {
                            repoSelect.value = ms.repository_id;
                            await handleRepoChange();
                            if (ms.collection) {
                                collectionSelect.value = ms.collection;
                                await handleCollectionChange();
                            }
                            msSelect.value = msId;
                        }
                        selectManuscript(ms);
                    }
                } catch (e) {
                    console.error('Failed to load manuscript by ID:', e);
                }
            } else if (manifestUrl) {
                loadManifest(manifestUrl);
            }
        });

        // =============================================
        // OPENSEADRAGON SETUP
        // =============================================

        function initOSD() {
            osdViewer = OpenSeadragon({
                id: 'osd-viewer',
                prefixUrl: OSD_PREFIX,
                // Disable all default controls - we use custom overlay buttons
                showNavigationControl: false,
                showZoomControl: false,
                showHomeControl: false,
                showFullPageControl: false,
                showRotationControl: false,
                visibilityRatio: 0.5,
                minZoomLevel: 0.5,
                maxZoomLevel: 20,
                zoomPerClick: 1.5,
                zoomPerScroll: 1.2,
                animationTime: 0.3,
                gestureSettingsMouse: { scrollToZoom: true },
                gestureSettingsTouch: { pinchToZoom: true },
                crossOriginPolicy: 'Anonymous',
                loadTilesWithAjax: false,
                immediateRender: false,
                imageLoaderLimit: 8,
                background: '#141414',
            });

            // Loading events
            osdViewer.addHandler('open', () => {
                loadingOverlay.classList.add('hidden');
            });
            osdViewer.addHandler('open-failed', (event) => {
                loadingOverlay.textContent = 'Failed to load image';
                console.error('OSD open failed:', event);
            });

            // Wire custom overlay controls to OSD actions
            document.getElementById('osd-zoom-in').addEventListener('click', () => {
                osdViewer.viewport && osdViewer.viewport.zoomBy(1.4);
            });
            document.getElementById('osd-zoom-out').addEventListener('click', () => {
                osdViewer.viewport && osdViewer.viewport.zoomBy(0.7);
            });
            document.getElementById('osd-home').addEventListener('click', () => {
                osdViewer.viewport && osdViewer.viewport.goHome();
            });
            document.getElementById('osd-rotate').addEventListener('click', () => {
                if (osdViewer.viewport) {
                    const current = osdViewer.viewport.getRotation();
                    osdViewer.viewport.setRotation(current + 90);
                }
            });
        }

        // =============================================
        // IIIF MANIFEST PARSING
        // =============================================

        /**
         * Parse a IIIF Presentation API manifest (v2 or v3) into a
         * normalized list of canvas objects.
         */
        function parseManifest(manifest) {
            const result = [];

            // IIIF Presentation API v3
            if (manifest.type === 'Manifest' && manifest.items) {
                for (const canvas of manifest.items) {
                    if (canvas.type !== 'Canvas') continue;
                    const label = extractLabel(canvas.label);
                    let imageService = null;
                    let imageUrl = null;
                    let thumbnailUrl = null;

                    // Navigate annotation structure: items[0].items[0].body
                    const body = canvas.items?.[0]?.items?.[0]?.body;
                    if (body) {
                        imageUrl = body.id;
                        if (body.service) {
                            const svc = Array.isArray(body.service) ? body.service[0] : body.service;
                            imageService = svc.id || svc['@id'];
                        }
                    }

                    // Thumbnail
                    if (canvas.thumbnail) {
                        const thumb = Array.isArray(canvas.thumbnail) ? canvas.thumbnail[0] : canvas.thumbnail;
                        thumbnailUrl = thumb.id || thumb['@id'];
                    }
                    if (!thumbnailUrl && imageService) {
                        thumbnailUrl = imageService + '/full/,150/0/default.jpg';
                    }

                    result.push({ label, imageService, imageUrl, thumbnailUrl });
                }
            }
            // IIIF Presentation API v2
            else if (manifest.sequences) {
                const sequence = manifest.sequences[0];
                for (const canvas of (sequence.canvases || [])) {
                    const label = extractLabel(canvas.label);
                    let imageService = null;
                    let imageUrl = null;
                    let thumbnailUrl = null;

                    const resource = canvas.images?.[0]?.resource;
                    if (resource) {
                        imageUrl = resource['@id'];
                        if (resource.service) {
                            const svc = Array.isArray(resource.service) ? resource.service[0] : resource.service;
                            imageService = svc['@id'] || svc.id;
                        }
                    }

                    // Thumbnail
                    if (canvas.thumbnail) {
                        thumbnailUrl = typeof canvas.thumbnail === 'string'
                            ? canvas.thumbnail
                            : canvas.thumbnail['@id'] || canvas.thumbnail.id;
                    }
                    if (!thumbnailUrl && imageService) {
                        thumbnailUrl = imageService + '/full/,150/0/default.jpg';
                    }

                    result.push({ label, imageService, imageUrl, thumbnailUrl });
                }
            }

            return result;
        }

        /**
         * Extract a human-readable label from IIIF label formats.
         * Handles: plain string, {"@value": "..."}, {"en": ["..."]}, etc.
         */
        function extractLabel(label) {
            if (!label) return '';
            if (typeof label === 'string') return label;
            if (label['@value']) return label['@value'];
            // v3: { "en": ["fol. 1r"] }
            const values = Object.values(label);
            if (values.length > 0 && Array.isArray(values[0]) && values[0].length > 0) {
                return values[0][0];
            }
            return '';
        }

        // =============================================
        // MANIFEST LOADING
        // =============================================

        async function loadManifest(url) {
            placeholder.classList.add('hidden');
            loadingOverlay.textContent = 'Loading manifest...';
            loadingOverlay.classList.remove('hidden');

            try {
                const resp = await fetch(url);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const manifest = await resp.json();

                canvases = parseManifest(manifest);
                if (canvases.length === 0) {
                    loadingOverlay.textContent = 'No images found in manifest';
                    return;
                }

                currentIndex = 0;
                buildThumbnails();
                enableNavControls();
                showCanvas(0);

            } catch (e) {
                console.error('Failed to load manifest:', e);
                loadingOverlay.textContent = 'Failed to load manifest: ' + e.message;
            }
        }

        // =============================================
        // CANVAS DISPLAY
        // =============================================

        // fromUser distinguishes a page the reader asked for from one the page
        // opened by itself on load. Only the former may scroll the thumbnail
        // strip -- see updateThumbnailSelection().
        function showCanvas(index, fromUser = false) {
            if (index < 0 || index >= canvases.length) return;
            pageChangeFromUser = fromUser;
            currentIndex = index;
            const canvas = canvases[index];

            loadingOverlay.textContent = 'Loading image...';
            loadingOverlay.classList.remove('hidden');

            // Build tile source for OSD
            let tileSource;
            if (canvas.imageService) {
                // Normalize: strip trailing slash, append /info.json
                let svcUrl = canvas.imageService.replace(/\/+$/, '');
                tileSource = svcUrl + '/info.json';
            } else if (canvas.imageUrl) {
                tileSource = { type: 'image', url: canvas.imageUrl };
            } else {
                loadingOverlay.textContent = 'No image available for this page';
                return;
            }

            osdViewer.open(tileSource);
            updateNavState();
            updateThumbnailSelection();
            announcePosition();
        }

        /**
         * Give the current page a spoken identity.
         *
         * Two separate problems, one function:
         *  - The deep-zoom image is a <canvas>. It is focusable and pannable
         *    with the keyboard, but a canvas has no intrinsic text, so without
         *    a label it announces as nothing at all (WCAG 1.1.1).
         *  - Turning a page changes only the counter and the folio field, both
         *    silently, so a non-sighted user has no way to tell that anything
         *    happened (WCAG 4.1.3).
         */
        function announcePosition() {
            const canvas = canvases[currentIndex];
            if (!canvas) return;
            const shelfmark = (currentManuscript && currentManuscript.shelfmark) || '';
            const folio = canvas.label || `page ${currentIndex + 1}`;
            const where = `${folio} — image ${currentIndex + 1} of ${canvases.length}`;

            viewerStatus.textContent = where;

            // OSD builds its canvas asynchronously, so re-query each time
            // rather than caching a node that may have been replaced.
            const osdCanvas = document.querySelector('#osd-viewer .openseadragon-canvas');
            if (osdCanvas) {
                osdCanvas.setAttribute('role', 'img');
                osdCanvas.setAttribute('aria-label',
                    shelfmark ? `${shelfmark}, ${where}` : where);
            }
        }

        // =============================================
        // THUMBNAIL SIDEBAR
        // =============================================

        // Lazy-load thumbnails as they scroll into view
        const thumbObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (!entry.isIntersecting) return;
                const img = entry.target;
                if (img.dataset.src) {
                    img.src = img.dataset.src;
                    delete img.dataset.src;
                }
                thumbObserver.unobserve(img);
            });
        }, { root: null, rootMargin: '200px' });

        // Set by showCanvas(): was this page change asked for by the reader?
        let pageChangeFromUser = false;

        function buildThumbnails() {
            thumbGrid.innerHTML = '';

            const placeholder = 'data:image/svg+xml,' + encodeURIComponent(
                '<svg xmlns="http://www.w3.org/2000/svg" width="80" height="107" fill="%232a2a2a"><rect width="80" height="107"/></svg>'
            );

            canvases.forEach((canvas, i) => {
                // <button>, not <div>: these were click-only divs with no
                // tabindex, role or key handling, so the page strip was simply
                // unusable without a mouse (WCAG 2.1.1, 4.1.2). A real button
                // gets Enter/Space, the focus ring, and a button role for free.
                const item = document.createElement('button');
                item.type = 'button';
                item.className = 'thumb-item';
                item.dataset.index = i;
                item.setAttribute('aria-label', canvas.label
                    ? `Page ${i + 1} of ${canvases.length}: ${canvas.label}`
                    : `Page ${i + 1} of ${canvases.length}`);

                const img = document.createElement('img');
                // The button's aria-label already names the page; an alt here
                // would make screen readers announce the same words twice.
                img.alt = '';
                img.src = placeholder;
                if (canvas.thumbnailUrl) {
                    img.dataset.src = canvas.thumbnailUrl;
                    img.onerror = () => { /* keep placeholder */ };
                    thumbObserver.observe(img);
                }

                const label = document.createElement('span');
                label.className = 'thumb-label';
                label.textContent = canvas.label || `${i + 1}`;
                label.title = canvas.label || `Page ${i + 1}`;
                label.setAttribute('aria-hidden', 'true');

                item.appendChild(img);
                item.appendChild(label);

                item.addEventListener('click', () => {
                    showCanvas(i, true);
                });

                thumbGrid.appendChild(item);
            });

            updateThumbnailSelection();
        }

        function updateThumbnailSelection() {
            const items = thumbGrid.querySelectorAll('.thumb-item');
            items.forEach((item, i) => {
                const isActive = i === currentIndex;
                item.classList.toggle('active', isActive);
                // aria-current carries the selection to assistive tech; the
                // .active class is only paint.
                if (isActive) {
                    item.setAttribute('aria-current', 'true');
                } else {
                    item.removeAttribute('aria-current');
                }
                // Roving tabindex: exactly one thumbnail is in the tab order,
                // so Tab does not have to walk 200+ buttons to leave the strip.
                // Arrow keys move between them (see initThumbnailKeyboard).
                item.tabIndex = isActive ? 0 : -1;
            });

            // Scroll the active thumbnail into view -- but ONLY when the reader
            // asked for this page, never when the viewer opened it on load.
            //
            // Calling scrollIntoView() moves Chrome's sequential focus
            // navigation starting point to the scrolled element, and it does so
            // even when nothing actually scrolls (on load the strip is already
            // at the top, scrollTop stays 0, and the starting point still
            // moves). That parked the starting point inside the thumbnail
            // panel, and because the roving tabindex leaves exactly one
            // thumbnail tabbable, the first Tab landed past it on the divider:
            // skipping the skip link, the header, all three selects, the whole
            // toolbar and every thumbnail. Going forwards, a keyboard user
            // could not reach any control. Confirmed against the deployed site,
            // so it predates the skip link rather than being caused by it, and
            // confirmed as the cause by no-op'ing scrollIntoView, after which
            // the first Tab reaches the skip link.
            //
            // Gating on "first render" is not enough: updateThumbnailSelection()
            // runs more than once during load, so the second call still fired.
            const active = thumbGrid.querySelector('.thumb-item.active');
            if (active && pageChangeFromUser) {
                // Honour prefers-reduced-motion (2.3.3). CSS scroll-behavior
                // does not govern the option passed here, so the media query
                // has to be read in script.
                const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                active.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
            }
        }

        /**
         * Arrow-key navigation within the thumbnail strip.
         *
         * Focus moves, but the page is NOT loaded until Enter/Space. Following
         * focus would fire an OSD open() for every arrow press, so arrowing
         * through a 200-image manuscript would queue 200 manifest loads.
         *
         * Left/Up = previous, Right/Down = next. The grid is 1-2 columns
         * depending on a user-draggable divider, so a true 2-D model would be
         * unpredictable; a linear one always does what it looks like it does.
         *
         * stopPropagation matters: initKeyboard() binds Arrow keys on document
         * for page navigation. This listener sits on the grid and therefore
         * runs first, so without it every arrow press would both move focus
         * AND turn the page.
         */
        function initThumbnailKeyboard() {
            thumbGrid.addEventListener('keydown', (e) => {
                const items = [...thumbGrid.querySelectorAll('.thumb-item')];
                if (!items.length) return;
                const from = items.indexOf(document.activeElement);
                if (from === -1) return;

                let to = null;
                switch (e.key) {
                    case 'ArrowLeft':
                    case 'ArrowUp':    to = from - 1; break;
                    case 'ArrowRight':
                    case 'ArrowDown':  to = from + 1; break;
                    case 'Home':       to = 0; break;
                    case 'End':        to = items.length - 1; break;
                    default: return;
                }
                if (to === null || to < 0 || to >= items.length) return;

                e.preventDefault();
                e.stopPropagation();
                items[from].tabIndex = -1;
                items[to].tabIndex = 0;
                items[to].focus();
                items[to].scrollIntoView({ block: 'nearest' });
            });
        }

        // =============================================
        // NAVIGATION
        // =============================================

        function initNavigation() {
            btnFirst.addEventListener('click', () => showCanvas(0, true));
            btnPrev.addEventListener('click', () => showCanvas(currentIndex - 1, true));
            btnNext.addEventListener('click', () => showCanvas(currentIndex + 1, true));
            btnLast.addEventListener('click', () => showCanvas(canvases.length - 1, true));

            // Folio input: jump to matching canvas on Enter
            folioInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    jumpToFolio(folioInput.value.trim());
                }
            });

            // Fullscreen
            btnFullscreen.addEventListener('click', toggleFullscreen);
        }

        function enableNavControls() {
            folioInput.disabled = false;
        }

        function updateNavState() {
            const n = canvases.length;
            const i = currentIndex;

            btnFirst.disabled = (i <= 0);
            btnPrev.disabled = (i <= 0);
            btnNext.disabled = (i >= n - 1);
            btnLast.disabled = (i >= n - 1);

            imageCounter.textContent = `Image ${i + 1} of ${n}`;
            folioInput.value = canvases[i]?.label || '';
        }

        function jumpToFolio(query) {
            if (!query || canvases.length === 0) return;
            const q = query.toLowerCase();

            // Try exact match first
            let idx = canvases.findIndex(c => (c.label || '').toLowerCase() === q);
            // Try contains match
            if (idx < 0) {
                idx = canvases.findIndex(c => (c.label || '').toLowerCase().includes(q));
            }
            // Try numeric: "5" → canvas index 4
            if (idx < 0) {
                const num = parseInt(query, 10);
                if (!isNaN(num) && num >= 1 && num <= canvases.length) {
                    idx = num - 1;
                }
            }

            if (idx >= 0) {
                showCanvas(idx, true);
            } else {
                // Flash the input to indicate no match
                folioInput.style.borderColor = '#c9917a';
                setTimeout(() => { folioInput.style.borderColor = ''; }, 800);
            }
        }

        function toggleFullscreen() {
            const el = document.documentElement;
            if (!document.fullscreenElement) {
                el.requestFullscreen?.() || el.webkitRequestFullscreen?.();
            } else {
                document.exitFullscreen?.() || document.webkitExitFullscreen?.();
            }
        }

        // Drive aria-pressed from the fullscreenchange EVENT, not from the
        // click handler: the user can also leave fullscreen with Escape or the
        // browser's own chrome, and a toggle that lies about its state is
        // worse than one that never claims a state at all.
        document.addEventListener('fullscreenchange', () => {
            btnFullscreen.setAttribute('aria-pressed',
                document.fullscreenElement ? 'true' : 'false');
        });

        // =============================================
        // KEYBOARD SHORTCUTS
        // =============================================

        function initKeyboard() {
            document.addEventListener('keydown', (e) => {
                // Don't intercept when typing in inputs
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') {
                    return;
                }
                if (canvases.length === 0) return;

                switch (e.key) {
                    case 'ArrowLeft':
                        e.preventDefault();
                        showCanvas(currentIndex - 1, true);
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        showCanvas(currentIndex + 1, true);
                        break;
                    case 'Home':
                        e.preventDefault();
                        showCanvas(0, true);
                        break;
                    case 'End':
                        e.preventDefault();
                        showCanvas(canvases.length - 1, true);
                        break;
                    case 'f':
                        e.preventDefault();
                        toggleFullscreen();
                        break;
                }
            });
        }

        // =============================================
        // RESIZABLE DIVIDER
        // =============================================

        const THUMB_MIN = 90, THUMB_MAX = 400;

        /** Single place that resizes the panel, so pointer and keyboard paths
         *  cannot drift apart on clamping or on reporting aria-valuenow. */
        function setThumbWidth(px) {
            const w = Math.max(THUMB_MIN, Math.min(THUMB_MAX, Math.round(px)));
            thumbPanel.style.width = w + 'px';
            divider.setAttribute('aria-valuenow', String(w));
            return w;
        }

        function initDivider() {
            let isDragging = false;

            // Keyboard resizing. Without this the divider is pointer-only, so
            // the panel width is simply unavailable to a keyboard user
            // (WCAG 2.1.1). Step of 20px, or 60px with Shift for coarse moves.
            divider.addEventListener('keydown', (e) => {
                const current = thumbPanel.getBoundingClientRect().width;
                const step = e.shiftKey ? 60 : 20;
                let next = null;
                switch (e.key) {
                    case 'ArrowLeft':  next = current - step; break;
                    case 'ArrowRight': next = current + step; break;
                    case 'Home':       next = THUMB_MIN; break;
                    case 'End':        next = THUMB_MAX; break;
                    default: return;
                }
                e.preventDefault();
                e.stopPropagation();   // don't also turn the page
                setThumbWidth(next);
            });

            divider.addEventListener('mousedown', (e) => {
                isDragging = true;
                divider.classList.add('dragging');
                document.body.classList.add('dragging');
                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const bodyRect = document.getElementById('viewer-body').getBoundingClientRect();
                const metaSidebar = document.getElementById('meta-sidebar');
                const metaWidth = metaSidebar.getBoundingClientRect().width;
                // thumbPanel left edge = bodyRect.left + metaWidth
                const thumbLeft = bodyRect.left + metaWidth;
                setThumbWidth(e.clientX - thumbLeft);
            });

            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    divider.classList.remove('dragging');
                    document.body.classList.remove('dragging');
                }
            });

            // Touch support
            divider.addEventListener('touchstart', (e) => {
                isDragging = true;
                divider.classList.add('dragging');
                document.body.classList.add('dragging');
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const touch = e.touches[0];
                const bodyRect = document.getElementById('viewer-body').getBoundingClientRect();
                const metaSidebar = document.getElementById('meta-sidebar');
                const metaWidth = metaSidebar.getBoundingClientRect().width;
                const thumbLeft = bodyRect.left + metaWidth;
                setThumbWidth(touch.clientX - thumbLeft);
            }, { passive: true });

            document.addEventListener('touchend', () => {
                if (isDragging) {
                    isDragging = false;
                    divider.classList.remove('dragging');
                    document.body.classList.remove('dragging');
                }
            });
        }

        // =============================================
        // MANUSCRIPT SELECTOR
        // =============================================

        function populateRepos() {
            repoSelect.innerHTML = '<option value="">-- Select repository --</option>';
            repositories.sort((a, b) => a.name.localeCompare(b.name)).forEach(r => {
                const opt = document.createElement('option');
                opt.value = r.id;
                opt.textContent = `${r.short_name || r.name} (${r.manuscript_count})`;
                repoSelect.appendChild(opt);
            });
        }

        async function handleRepoChange() {
            const repoId = repoSelect.value;
            currentRepoId = repoId;
            currentCollection = null;

            // Reset dependent dropdowns
            collectionSelect.innerHTML = '<option value="">-- Select collection --</option>';
            collectionSelect.disabled = true;
            msSelect.innerHTML = '<option value="">-- Select manuscript --</option>';
            msSelect.disabled = true;
            msCount.textContent = '';

            if (!repoId) return;

            // Load collections for this repository
            try {
                const resp = await fetch(`${API_BASE}/repositories/${repoId}`);
                const repo = await resp.json();
                if (repo.collections && repo.collections.length > 0) {
                    repo.collections.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c.name;
                        opt.textContent = `${c.name} (${c.count})`;
                        collectionSelect.appendChild(opt);
                    });
                    collectionSelect.disabled = false;
                } else {
                    // No collections - load manuscripts directly, skip collection step
                    collectionSelect.innerHTML = '<option value="">(no collections)</option>';
                    await loadManuscriptsForRepo(repoId);
                }
            } catch (e) {
                console.error('Failed to load repository details:', e);
            }
        }

        async function loadManuscriptsForRepo(repoId) {
            // Load all manuscripts for a repository (used when no collections exist)
            try {
                const resp = await fetch(`${API_BASE}/manuscripts?repository_id=${repoId}&limit=200`);
                const data = await resp.json();
                const manuscripts = (data.manuscripts || []).filter(m => m.iiif_manifest_url);

                manuscripts.sort((a, b) => (a.shelfmark || '').localeCompare(b.shelfmark || '')).forEach(ms => {
                    const opt = document.createElement('option');
                    opt.value = ms.id;
                    opt.textContent = `${ms.shelfmark || 'MS ' + ms.id}${ms.date_display ? ' (' + ms.date_display + ')' : ''}`;
                    msSelect.appendChild(opt);
                });
                msSelect.disabled = false;
                msCount.textContent = `(${manuscripts.length} viewable)`;
            } catch (e) {
                console.error('Failed to load manuscripts:', e);
            }
        }

        async function handleCollectionChange() {
            const collection = collectionSelect.value;
            currentCollection = collection;

            // Reset manuscript dropdown
            msSelect.innerHTML = '<option value="">-- Select manuscript --</option>';
            msSelect.disabled = true;
            msCount.textContent = '';

            if (!collection || !currentRepoId) return;

            // Load manuscripts for this repository + collection
            try {
                const resp = await fetch(`${API_BASE}/manuscripts?repository_id=${currentRepoId}&collection=${encodeURIComponent(collection)}&limit=200`);
                const data = await resp.json();
                const manuscripts = (data.manuscripts || []).filter(m => m.iiif_manifest_url);

                manuscripts.sort((a, b) => (a.shelfmark || '').localeCompare(b.shelfmark || '')).forEach(ms => {
                    const opt = document.createElement('option');
                    opt.value = ms.id;
                    opt.textContent = `${ms.shelfmark || 'MS ' + ms.id}${ms.date_display ? ' (' + ms.date_display + ')' : ''}`;
                    msSelect.appendChild(opt);
                });
                msSelect.disabled = false;
                msCount.textContent = `(${manuscripts.length} viewable)`;
            } catch (e) {
                console.error('Failed to load manuscripts:', e);
            }
        }

        async function handleMsSelection() {
            const id = msSelect.value;
            if (!id) return;

            try {
                const resp = await fetch(`${API_BASE}/manuscripts/${id}`);
                const ms = await resp.json();
                if (ms && !ms.error) {
                    ms.repository = ms.repository_short || ms.repository_name || ms.repository;
                    selectManuscript(ms);
                }
            } catch (e) {
                console.error('Failed to load manuscript:', e);
            }
        }

        async function selectManuscript(ms) {
            currentManuscript = ms;
            renderMetadata(ms);
            setPageTitle(ms);

            if (ms.iiif_manifest_url) {
                await loadManifest(ms.iiif_manifest_url);
                updateUrl(ms.id);
            }
        }

        // The document title is the first thing a screen reader announces on
        // arrival and the only label a user has in a tab strip or history list.
        // A static "Manuscript Viewer" makes every manuscript indistinguishable
        // (WCAG 2.4.2), so name the manuscript actually on screen.
        const BASE_TITLE = 'Compilatio - Manuscript Viewer';

        function setPageTitle(ms) {
            document.title = (ms && ms.shelfmark)
                ? `${ms.shelfmark} - ${BASE_TITLE}`
                : BASE_TITLE;
        }

        // =============================================
        // METADATA PANEL
        // =============================================

        function renderMetadata(ms) {
            if (!ms) {
                metaContent.innerHTML = '<p class="meta-placeholder">Select a manuscript to view details.</p>';
                return;
            }

            // <h2>, not <h3>: the site title is the <h1> and nothing sits between
            // them, so an <h3> here skipped a level (WCAG 1.3.1). The shelfmark is
            // the subject of the page, which is exactly what an <h2> should be.
            let html = `<h2>${esc(ms.shelfmark || '')}</h2>`;
            if (ms.repository) html += `<p class="meta-repo">${esc(ms.repository)}</p>`;
            if (ms.date_display) html += `<p class="meta-date">${esc(ms.date_display)}</p>`;

            if (ms.language || ms.folios) {
                html += `<details class="meta-section" open>
                    <summary>Physical</summary>
                    <dl class="meta-list">
                        ${ms.language ? `<dt>Language</dt><dd>${esc(ms.language)}</dd>` : ''}
                        ${ms.folios ? `<dt>Folios</dt><dd>${esc(ms.folios)}</dd>` : ''}
                    </dl>
                </details>`;
            }

            if (ms.contents) {
                html += `<details class="meta-section">
                    <summary>Contents</summary>
                    <p class="meta-text">${esc(ms.contents)}</p>
                </details>`;
            }

            if (ms.provenance) {
                html += `<details class="meta-section">
                    <summary>Provenance</summary>
                    <p class="meta-text">${esc(ms.provenance)}</p>
                </details>`;
            }

            if (ms.source_url) {
                html += `<a href="${esc(ms.source_url)}" class="source-link" target="_blank" rel="noopener">View at Source<span class="visually-hidden"> (opens in a new window)</span></a>`;
            }

            metaContent.innerHTML = html;
        }

        // =============================================
        // URL MANAGEMENT
        // =============================================

        function updateUrl(msId) {
            const url = new URL(window.location);
            url.searchParams.delete('manifest');
            url.searchParams.delete('ms');
            if (msId) url.searchParams.set('ms', msId);
            if (currentIndex > 0) url.searchParams.set('canvas', currentIndex);
            window.history.replaceState({}, '', url);
        }

        // =============================================
        // UTILITIES
        // =============================================

        function esc(text) {
            if (!text) return '';
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

    })();
    </script>
</body>
